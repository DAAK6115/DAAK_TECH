name: Build DAAK_TECH for TPECloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/deploy-tpecloud.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux standalone package
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install all build dependencies
        run: npm ci --include=dev

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build Next.js standalone
        run: npm run build

      - name: Package production server
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p deploy/public deploy/.next/static
          cp -a .next/standalone/. deploy/
          if test -d public; then cp -a public/. deploy/public/; fi
          cp -a .next/static/. deploy/.next/static/
          test -f deploy/server.js
          tar -czf daaktech-release.tar.gz -C deploy .
          ls -lh daaktech-release.tar.gz

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: daaktech-tpecloud-${{ github.run_number }}
          path: daaktech-release.tar.gz
          if-no-files-found: error
          retention-days: 7
